[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alphafade"
dynamic = ["version"]
description = "Is my trading signal dying? Measure calendar-time alpha decay, half-lives, structural breaks, publication effects, and crowding."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeevun Sandhu" }]
requires-python = ">=3.11"
keywords = [
    "quant",
    "finance",
    "alpha decay",
    "information coefficient",
    "half-life",
    "structural break",
    "comomentum",
    "crowding",
    "anomalies",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
# Keep the core install small: only what the math actually imports.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/JSand15/alphafade"
Repository = "https://github.com/JSand15/alphafade"
Issues = "https://github.com/JSand15/alphafade/issues"
Changelog = "https://github.com/JSand15/alphafade/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.14; python_version >= '3.12'",
    # Test-only oracle: our Newey-West / regression numbers must match statsmodels.
    "statsmodels>=0.14.2",
    "matplotlib>=3.8",
]

[tool.hatch.version]
path = "src/alphafade/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/alphafade", "tests", "README.md", "CHANGELOG.md", "LICENSE", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/alphafade"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/alphafade"]
addopts = "--doctest-modules --strict-markers -ra -m 'not network'"
markers = ["network: hits the internet; deselected by default"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS", "NUMBER"]

[tool.coverage.run]
source = ["alphafade"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "@overload"]

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = [
    "SPEC.md",  # Jeevun's original brief, kept verbatim
    "src/alphafade/_supwald_table.py",  # generated by scripts/make_supwald_table.py
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD", "RUF", "SIM", "C4", "PT", "D"]
ignore = [
    "D105",   # magic methods don't need docstrings
    "D107",   # __init__ documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PD", "NPY002", "PT018"]
"scripts/**" = ["D"]
"examples/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/alphafade"]
