name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs get read-only repo access unless they ask for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra plot
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Tests + doctests with coverage
        run: uv run pytest -q --cov --cov-report=term --cov-fail-under=90

  lowest-deps:
    # Proves the minimum versions in pyproject.toml (numpy/pandas/scipy) really work.
    name: Oldest supported numpy / pandas / scipy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: Install lowest direct dependencies
        run: uv sync --resolution lowest-direct --extra plot
      - name: Versions
        run: uv run python -c "import numpy, pandas, scipy; print(numpy.__version__, pandas.__version__, scipy.__version__)"
      - name: Tests
        run: uv run pytest -q

  build:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and import it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import alphafade as af; print(af.__version__, len(af.__all__))"
